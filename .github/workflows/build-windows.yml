name: Build Release for Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build Project
      shell: bash
      env:
        MSYS_NO_PATHCONV: 1
      run: |
        # Собираем абсолютно все файлы .cpp в проекте, где бы они ни лежали
        CPP_FILES=$(find . -name "*.cpp" | tr '\n' ' ')
        echo "Найдено файлов для сборки: $CPP_FILES"
        
        # Компилируем проект со всеми необходимыми библиотеками интерфейса .NET 4.8
        cl.exe -clr -O2 \
          -AI "C:/Program Files/Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8" \
          -FU "System.dll" \
          -FU "System.Windows.Forms.dll" \
          -FU "System.Drawing.dll" \
          -FU "System.Data.dll" \
          $CPP_FILES -Fe:graphic_calc.exe \
          -link -subsystem:windows -entry:main

    - name: Create Release and Upload Artifact
      uses: softprops/action-gh-release@v2
      with:
        files: graphic_calc.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
